<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#111312" />
    <link rel="icon" href="data:," />
    <title>Omega Spiral</title>
  </head>
  <body>
    <main id="app">
      <canvas id="game-canvas" aria-label="Omega Spiral game world"></canvas>
      <section id="hud" aria-live="polite">
        <div class="hud-metric"><span>Omega Spiral</span><strong>Floor 1 · Light</strong></div>
        <div id="status-line">Choose a path: door · monster · chest</div>
      </section>
      <section id="outcome-panel" aria-live="polite" hidden>
        <span class="outcome-eyebrow">The Echo Chamber</span>
        <p id="outcome-text"></p>
      </section>
      <p id="controls-hint">WASD / arrows · move &nbsp; Shift / Space · dash &nbsp; E · choose &nbsp; R · retry</p>
      <div id="touch-controls" aria-hidden="true">
        <div id="touch-stick">
          <div id="touch-knob"></div>
        </div>
        <div class="touch-actions"><button id="interact-button" type="button">Choose</button><button id="dash-button" type="button">Dash</button></div>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
