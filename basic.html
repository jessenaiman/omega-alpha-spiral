<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M12 12h40v40H12z' fill='%237cf0ff'/%3E%3Cpath d='M22 22h20v20H22z' fill='%230a0e16'/%3E%3C/svg%3E">
    <title>Basic — Blender MCP kit demo</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0a0e16; overflow: hidden; }
      canvas[data-basic-canvas] { display: block; width: 100vw; height: 100vh; }
      [data-basic-hud] {
        position: fixed; top: 14px; left: 14px; z-index: 10;
        display: flex; gap: 18px; padding: 8px 12px;
        background: rgba(8, 11, 18, 0.72); border: 1px solid rgba(124, 240, 255, 0.25);
        border-radius: 8px; color: #cfe6ff; font: 12px/1.4 ui-monospace, monospace;
      }
      [data-basic-hud] b { color: #7cf0ff; }
      [data-basic-status] {
        position: fixed; bottom: 12px; left: 14px; color: #8a93a6;
        font: 11px ui-monospace, monospace;
      }
    </style>
  </head>
  <body>
    <canvas data-basic-canvas tabindex="0" aria-label="Blender MCP basic demo arena"></canvas>
    <div data-basic-hud>
      <span>STEPS <b data-basic-steps>0</b></span>
      <span>GEMS <b data-basic-gems>0</b></span>
    </div>
    <div data-basic-status>loading demo-kit.glb...</div>
    <script type="module" src="/src/basic/main.ts"></script>
  </body>
</html>
