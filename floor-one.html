<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%2304060b'/%3E%3Ctext x='32' y='44' font-size='40' text-anchor='middle' fill='%237cf0ff' font-family='monospace'%3E@%3C/text%3E%3C/svg%3E">
    <title>Floor One | Omega Spiral</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #cfe6ff; --dim: #6b7891; --cyan: #7cf0ff; --gold: #ffd166; --red: #ff5566; --green: #8fd694;
        --bg: #04060b; --panel: #06090f; --line: rgba(124, 240, 255, 0.16);
        --safe-t: env(safe-area-inset-top, 0px); --safe-r: env(safe-area-inset-right, 0px);
        --safe-b: env(safe-area-inset-bottom, 0px); --safe-l: env(safe-area-inset-left, 0px);
      }
      html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; color: var(--ink);
        font: 12px/1.5 ui-monospace, "Cascadia Mono", Consolas, monospace; }
      #app { display: flex; flex-direction: column; height: 100vh; box-sizing: border-box;
        padding: var(--safe-t) var(--safe-r) var(--safe-b) var(--safe-l); }

      [data-hud] { display: flex; gap: 16px; align-items: center; flex-wrap: wrap;
        padding: 10px 12px; border-bottom: 1px solid var(--line); font-size: 11px; letter-spacing: 0.04em; }
      [data-hud] .cluster { display: flex; gap: 8px; align-items: center; }
      [data-hud] .label { color: var(--dim); }
      [data-hud] .spacer { flex: 1 1 auto; }
      [data-pips] { letter-spacing: 2px; font-size: 13px; }
      [data-turn] { display: inline-block; min-width: 4ch; text-align: right; color: var(--ink); }
      [data-objective] { color: var(--gold); }
      [data-threat] { color: var(--dim); }

      #main { display: flex; flex: 1 1 auto; min-height: 0; }
      canvas[data-game-canvas] { flex: 1 1 auto; min-width: 0; display: block; width: 100%; height: 100%; outline: none; }
      aside[data-panel] { flex: 0 0 300px; display: flex; flex-direction: column; min-height: 0;
        border-left: 1px solid var(--line); background: linear-gradient(180deg, #06090f, #04060b); }
      [data-message-log] { flex: 1 1 auto; list-style: none; margin: 0; padding: 10px 12px; overflow-y: auto;
        font-size: 11px; color: var(--dim); }
      [data-message-log] li { padding: 2px 0; border-bottom: 1px dotted rgba(124, 240, 255, 0.07); }
      [data-message-log] li:last-child { color: var(--ink); }
      [data-legend] { border-top: 1px solid var(--line); padding: 8px 12px; font-size: 11px; color: var(--dim); }
      [data-legend] b { color: var(--ink); }

      [data-overlay] { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center;
        background: rgba(4, 6, 11, 0.86);
        padding: calc(var(--safe-t) + 16px) 16px calc(var(--safe-b) + 16px); }
      [data-overlay][hidden] { display: none; }
      [data-overlay] .panel { max-width: 440px; width: 100%; padding: 20px 22px; background: #070b12;
        border: 1px solid var(--line); box-shadow: inset 0 0 0 1px rgba(4, 6, 11, 0.9), 0 0 40px rgba(124, 240, 255, 0.06); }
      [data-overlay-title] { font-size: 14px; letter-spacing: 0.12em; }
      [data-overlay-body] { margin: 10px 0 16px; color: var(--dim); }
      [data-overlay] .actions { color: var(--ink); }
      [data-overlay] kbd { color: var(--ink); border: 1px solid rgba(207, 230, 255, 0.35); border-radius: 3px; padding: 1px 6px; }

      @media (max-width: 860px) {
        #main { flex-direction: column; }
        aside[data-panel] { flex: 0 0 auto; border-left: none; border-top: 1px solid var(--line); }
        [data-message-log] { max-height: 20vh; }
        [data-hud] { gap: 10px; padding: 8px 10px; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <header data-hud>
        <div class="cluster"><span class="label">HP</span><span data-pips aria-label="health"></span></div>
        <div class="cluster"><span class="label">TURN</span><span data-turn>0</span></div>
        <div class="spacer"></div>
        <div class="cluster"><span data-objective>Reach the stairs</span></div>
        <div class="cluster"><span data-threat></span></div>
      </header>
      <div id="main">
        <canvas data-game-canvas tabindex="0" aria-label="Floor One"></canvas>
        <aside data-panel>
          <ol data-message-log aria-label="message history"></ol>
          <footer data-legend>
            <b>Arrows/WASD</b> move · <b>Space</b> wait · <b>T</b> talk · <b>H</b> hit · <b>Shift+dir</b> run · <b>I</b> inspect · <b>Esc</b> pause
          </footer>
        </aside>
      </div>
    </div>

    <div data-overlay hidden>
      <div class="panel">
        <div data-overlay-title></div>
        <div data-overlay-body></div>
        <div class="actions" data-overlay-actions></div>
      </div>
    </div>

    <script type="module" src="/src/floor-one/main.ts"></script>
  </body>
</html>
