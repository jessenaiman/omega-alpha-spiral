<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="An unfinished invitation. omega-spiral opening study." />
    <link rel="icon" href="data:," />
    <title>omega-spiral — an invitation</title>
  </head>
  <body class="os-body">
    <main class="os-boot" data-os-phase-ts="cursor" data-os-art-ts="loading" data-os-plate-ts="0" data-os-format-ts="plain" data-os-corrupt-ts="false" data-os-text-ts="loading" data-os-voice-ts="-1">
      <canvas id="os-canvas-ts" class="os-canvas" aria-hidden="true"></canvas>
      <!-- Accessible mirror only. The visible cursor, letters and choices are WebGL assets. -->
      <section class="os-sr" aria-label="An invitation">
        <div id="os-feed-ts" class="os-feed">
        <pre id="os-transcript-ts" class="os-transcript" aria-hidden="true"></pre>
        <p class="os-prelude"><span id="os-prelude-ts"></span><span class="os-cursor os-prelude-cursor" aria-hidden="true">▌</span></p>
        <h1 class="os-question"><span id="os-question-ts" aria-hidden="true"></span><span class="os-cursor os-question-cursor" aria-hidden="true">▌</span><span id="os-accessible-question-ts" class="os-sr" aria-live="polite"></span></h1>
        </div>
        <fieldset id="os-choices-ts" class="os-choices" aria-labelledby="os-accessible-question-ts" disabled>
          <legend class="os-sr">Choose a story</legend>
          <label class="os-choice"><input type="radio" name="story" value="fantasy" /><span class="os-choice-copy"></span></label>
          <label class="os-choice"><input type="radio" name="story" value="romance" /><span class="os-choice-copy"></span></label>
          <label class="os-choice"><input type="radio" name="story" value="horror" /><span class="os-choice-copy"></span></label>
        </fieldset>
        <p id="os-aside-ts" aria-live="polite"></p>
      </section>
      <p id="os-error-ts" class="os-error" role="alert"></p>
      <footer class="os-footer"><span>1 2 3 · ↑ ↓ · click a story</span><button id="os-replay-ts" class="os-replay" type="button">replay boot ↺</button></footer>
    </main>
    <noscript>This opening needs JavaScript enabled.</noscript>
    <script type="module" src="/src/intro/main.ts"></script>
  </body>
</html>
